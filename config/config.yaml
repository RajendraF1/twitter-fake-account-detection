data:
  train_path: "data/raw/train_data_eps1.xlsx"
  test_path: "data/raw/test_data_eps1.xlsx"
  reference_date: "2025-12-02"

features:
  columns:
    - followers_count
    - friends_count
    - post_count
    - location_available
    - lang_encode
    - desc_len
    - account_age_days
    - follower_friend_ratio
    - screen_name_numeric_ratio
    - url_available
    - description_has_url
  target: "fake"

model:
  slp:
    hidden_layer_sizes: []
    activation: "logistic"
    solver: "adam"
    max_iter: 1000
    random_state: 42
  logistic_regression:
    max_iter: 1000
    random_state: 42
  random_forest:
    n_estimators: 100
    random_state: 42
  xgboost:
    n_estimators: 100
    random_state: 42
    eval_metric: "logloss"

training:
  test_size: 0.2
  cv_folds: 5
  scoring: "accuracy"

paths:
  processed_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
