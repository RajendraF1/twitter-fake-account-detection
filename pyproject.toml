[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "twitter-fake-account-detection"
version = "0.1.0"
description = "Multi-model machine learning project for detecting fake Twitter accounts"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "pandas",
    "scikit-learn",
    "openpyxl",
    "joblib",
    "matplotlib",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "xgboost",
]

[project.scripts]
run-pipeline = "scripts.run_pipeline:main"
train = "scripts.train:main"
predict = "scripts.predict:main"

[tool.setuptools.packages.find]
include = ["src*", "scripts*", "app*"]
